<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site non visible</title>
<style>
  :root{
    --bg:#12131A;
    --bg2:#191B24;
    --text:#EDEAE3;
    --muted:#8B8D98;
    --amber:#F2A93B;
    --green:#3FBF8F;
    --line:#2A2C38;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:480px;
    width:100%;
    background:var(--bg2);
    border:1px solid var(--line);
    border-radius:18px;
    padding:44px 36px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:"SFMono-Regular", Consolas, monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:28px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 0 0 rgba(242,169,59,.6);
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(242,169,59,.55);}
    70%{box-shadow:0 0 0 10px rgba(242,169,59,0);}
    100%{box-shadow:0 0 0 0 rgba(242,169,59,0);}
  }
  h1{
    font-size:26px;
    line-height:1.3;
    font-weight:800;
    letter-spacing:-0.01em;
    margin-bottom:12px;
  }
  h1 span{color:var(--amber);}
  p.lead{
    color:var(--muted);
    font-size:15px;
    line-height:1.6;
    margin-bottom:32px;
  }
  .divider{
    height:1px;
    background:var(--line);
    margin:0 0 28px;
  }
  .label{
    font-family:"SFMono-Regular", Consolas, monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--green);
    margin-bottom:14px;
  }
  .dev-name{
    font-size:20px;
    font-weight:700;
    margin-bottom:22px;
    letter-spacing:.02em;
  }
  .numbers{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  a.number{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-family:"SFMono-Regular", Consolas, monospace;
    font-size:17px;
    color:var(--text);
    text-decoration:none;
    background:#14161F;
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    transition:border-color .2s ease, transform .15s ease;
  }
  a.number:hover{
    border-color:var(--green);
    transform:translateY(-1px);
  }
  a.number .flag{
    font-size:13px;
    color:var(--muted);
    letter-spacing:.05em;
  }
  .footer-tag{
    margin-top:28px;
    font-size:11px;
    color:var(--muted);
    letter-spacing:.05em;
  }
  @media (prefers-reduced-motion: reduce){
    .dot{animation:none;}
  }
</style>
</head>
<body>

  <div class="card">
    <div class="status"><span class="dot"></span> Site non visible</div>

    <h1>Ce site n'est pas encore <span>visible</span> sur internet.</h1>
    <p class="lead">Pour activer la visibilité de votre site, contactez le développeur en charge du projet.</p>

    <div class="divider"></div>

    <div class="label">Développeur</div>
    <div class="dev-name">Amadou Rouga</div>

    <div class="numbers">
      <a class="number" href="tel:+22791340905">+227 91 340 905 <span class="flag">NE</span></a>
      <a class="number" href="tel:+233502997960">+233 50 299 7960 <span class="flag">GH</span></a>
    </div>

    <div class="footer-tag">Contactez-nous pour rendre votre site visible</div>
  </div>

</body>
</html>
